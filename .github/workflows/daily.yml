name: Daily refresh

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 7:00 pm India time, every day
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to save the tracking log
  pages: write               # to publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download recent NSE insider filings
        continue-on-error: true      # if NSE blocks GitHub's servers, the saved snapshot is used instead
        run: python pit_fetch.py "$(date -d '27 months ago' +%Y-%m)"

      - name: Build the app data
        run: python monitor.py       # downloads fresh prices and writes app/data.json; stops if prices cannot be downloaded

      - name: Save the tracking log
        run: |
          git config user.name "promoter-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add tracking/flag_log.csv
          git diff --cached --quiet || (git commit -m "Update tracking log" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
