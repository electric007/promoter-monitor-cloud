name: Daily refresh

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 7:00 pm India time, every day
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to save the tracking log in this private repository

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download recent NSE insider filings
        continue-on-error: true      # if NSE blocks GitHub's servers, the saved snapshot is used instead
        run: python pit_fetch.py "$(date -d '27 months ago' +%Y-%m)"

      - name: Build the app data
        run: python monitor.py       # downloads fresh prices and writes app/data.json; stops if prices cannot be downloaded

      - name: Chart scan (all NSE stocks)
        continue-on-error: true      # if it fails, the page keeps the last chart scan
        run: python chart_scan.py

      - name: Save the tracking log
        run: |
          git config user.name "promoter-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add tracking/flag_log.csv
          git diff --cached --quiet || (git commit -m "Update tracking log" && git push)

      - name: Publish the page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir app --site "$NETLIFY_SITE_ID"
